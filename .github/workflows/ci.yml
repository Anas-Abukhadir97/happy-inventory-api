name: API CI
on:
  push:
    branches: [main, 'feat/**', 'fix/**', 'chore/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: api-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - run: dotnet restore HappyInventory.sln --locked-mode
      - run: dotnet build HappyInventory.sln --configuration Release --no-restore
      - run: dotnet format HappyInventory.sln --verify-no-changes --no-restore
      - run: dotnet test HappyInventory.sln --configuration Release --no-build --collect:"XPlat Code Coverage" --logger trx --results-directory artifacts/tests
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: api-test-results
          path: artifacts/tests
          if-no-files-found: warn
          retention-days: 14
